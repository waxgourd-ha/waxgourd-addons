---
name: DeepSeek Harness (Web)
version: "0.2.2.5.2"
slug: dsh_web
description: DeepSeek Harness 官方 Web UI（dsh web）+ Home Assistant 设备控制工具
url: https://github.com/deepseek-ai/deepseek-harness
arch:
  - aarch64
  - amd64
image: wghaos/addon-dsh-web
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - app_config:rw
  - homeassistant_config:rw
  - all_app_configs:rw
ingress: true
ingress_port: 8099
panel: true
panel_title: "deepseek harness"
panel_icon: mdi:robot-outline
panel_admin: false
options:
  deepseek_api_key: ""
  deepseek_base_url: ""
  workspace: "/config/dsh-workspace"
  log_level: "info"
schema:
  deepseek_api_key: password?
  deepseek_base_url: str
  workspace: str
  log_level: list(debug|info|warning|error)
