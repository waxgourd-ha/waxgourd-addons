---
name: NextChat + DSH Agent
# 版本号规则（两个 addon 统一）：
#   <dsh 引擎版本三段>.<rc 号>.<构建号>   →  例如 0.1.5.1.1 = 引擎 0.1.5rc1 的第 1 次构建
#   · 同一个引擎内只递增最后一位（改我们的胶水代码：界面/代理/日志）
#   · 升上游引擎时前三段/rc 号一起变（例如引擎 0.2.1rc1 → 0.2.1.1.1）
#   · 为什么不用 0.1.5rc1-1：HA 的 AwesomeVersion 把这种写法判为 invalid（UNKNOWN），
#     Supervisor 直接拒绝；SemVer 的 0.1.5-rc.1-1 虽然合法，但 -1 < -2 被判为 False。
#     5 段 SIMPLEVER 实测 .1 < .2 < .10 < .2.1 全部正确。
#   ⚠️ 版本号必须与镜像 tag 严格一致（Supervisor 拉的就是 <image>:<version>）。
version: "0.1.5.1.6"
slug: nextchat_dsh
description: NextChat 对话前端 + DeepSeek Harness 真 agent 引擎（含 Home Assistant 设备控制工具）
url: https://github.com/deepseek-ai/deepseek-harness
arch:
  - aarch64
  - amd64
# 预构建镜像：本仓库**不含 Dockerfile**，Supervisor 只按 `<image>:<version>` 拉取
# （tag 恒等于上面的 version），例如 wghaos/addon-nextchat-dsh:0.1.5.1.3
# —— 一个 amd64 + aarch64 同 tag 的多架构镜像。
# 镜像名与构建仓库（davidg/nextchat-dsh）CI 推的名字**完全一致**，两边只靠 version/tag 对齐。
# ⚠️ 运行时代码（s6 服务、/opt/dsh-agent/**）都在镜像里：改脚本要去构建仓库改并重新出镜像，
#    改这个目录是没有任何效果的。
image: wghaos/addon-nextchat-dsh
init: false
startup: application
boot: auto
# 拿到 SUPERVISOR_TOKEN，MCP 工具才能调用 HA Core API（不需要长期令牌）
homeassistant_api: true
hassio_api: true
# 容器里装了 `ha` CLI，但默认角色不够用（`ha apps` 会 forbidden）。
# manager = Supervisor 的管理级 API（与 advancedssh 同做法）。
# 注意：这意味着容器内那个 SUPERVISOR_TOKEN 也具备管理权限；
# 但我们**没有**开 docker_api / privileged / host_network，控制面仍比 advancedssh 小很多。
hassio_role: manager
# 刻意**不声明任何 ports**：整个 app 只从 HA 的 Ingress 进出，
# 局域网里不会再出现 3000/8000 这类裸露端口。
#   - NextChat    : 127.0.0.1:3000（容器内）
#   - agent API   : 127.0.0.1:8000（容器内）
#   - Ingress 代理: 0.0.0.0:8099（只由 Supervisor 转发，不在 host 上发布）
# 挂载（Supervisor 规范名）：
#   app_config:rw           → 容器 /config      本 app 自己的配置/数据目录
#                             （host 侧 /app_configs/nextchat_dsh，会随备份一起走）
#   homeassistant_config:rw → 容器 /homeassistant  HA 的配置目录（configuration.yaml 等）
map:
  - app_config:rw
  - homeassistant_config:rw
# ── HA 内嵌入口（Ingress）──
# NextChat 是 Next.js、资源用绝对路径 /_next/...，而 Supervisor 转发时会剥掉
# /api/hassio_ingress/<token> 前缀，所以必须经一层「路径重写代理」（:8099）才能用。
# 该代理同时把 <prefix>/agent-api/* 转发给 agent API，前端因此可以走同源地址，
# 无需对外暴露 8000。
# 注意：这里**不写 webui**，否则按钮会去开外部端口而不是走 ingress。
ingress: true
ingress_port: 8099
panel: true
panel_title: deepseekchat
panel_icon: mdi:chat-processing-outline
panel_admin: false
options:
  deepseek_base_url: "https://api.deepseek.com"
  provider: "deepseek-official"
  model: "deepseek-flash"
  profile: "sdk"
  reasoning_effort: "high"
  max_tokens: 32768
  permission_mode: "danger-full-access"
  # 打开 HA 设备控制工具（MCP：ha_list_entities / ha_get_state / ha_call_service / ha_render_template）
  enable_ha_tools: true
  cors_allow_origins: "*"
  log_level: "info"
  # 默认模型：**留空就用模型清单里的第一个**（推荐，管理页刻意不提供这个选项，
  # 避免和「选择器即大脑」重复）。只有想钉死成别的才填：
  # 格式 <运营商>/<模型>@<运营商>（如 kimi/k3@kimi），且必须在当前清单里，否则忽略。
  default_model: ""
  # ⚠️ 保持 false，别设成 true！
  # NextChat 的 auth() 里有一条硬规则（app/api/auth.ts）：
  #     if (serverConfig.hideUserApiKey && !!apiKey) → 401 "not allowed to access with your own api key"
  # 而客户端只把 hideUserApiKey 用于**隐藏输入框**，并**不停止发送已保存的 key**
  # → 任何“以前填过 key”的浏览器都会每条消息 401。
  # 保持 false 更宽容：不填 key 也行（auth() 会注入占位 key），填了也不报错（
  # 网关注入各运营商自己的 key，会覆盖掉前端带来的那个）。
  hide_user_api_key: false
  # 界面语言：auto = 跟随 NextChat 自己的 locale（推荐）；也可强制 zh / en。
  #   只影响【我们额外加的界面】——过程块的标题、首次配置向导、管理页；
  #   NextChat 自身的多语言由它自己的设置控制，与本项无关。
  ui_language: "auto"
schema:
  # 可选：留空就跳过注入，由应用内向导或管理页填 key。
  deepseek_api_key: password?
  deepseek_base_url: str
  provider: str
  model: str
  profile: list(sdk|sdk-minimal)
  reasoning_effort: list(off|low|high|max)
  max_tokens: int(1024,393216)
  permission_mode: str
  enable_ha_tools: bool
  cors_allow_origins: str
  log_level: list(debug|info|warning|error)
  default_model: str
  hide_user_api_key: bool
  ui_language: list(auto|zh|en)
