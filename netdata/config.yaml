name: Netdata
version: 2.10.3
slug: netdata
description: 'Netdata每秒收集指标，并将其显示在漂亮的低延迟仪表板中'
url: https://github.com/waxgourd-ha/waxgourd-addons
image: wghaos/netdata
init: false
arch:
  - aarch64
  - amd64
privileged:
  - SYS_ADMIN
  - SYS_PTRACE
# Netdata 的 dashboard 使用绝对路径（/api/v1/...、/api/v2/...），不支持子路径部署，
# 因此无法在 Home Assistant ingress（/api/hassio_ingress/<token>/）下工作。
# 这里关闭 ingress，改由 webui + 映射端口提供入口（"打开网页界面"按钮）。
webui: http://[HOST]:[PORT:19999]
ports:
  19999/tcp: 19999
ports_description:
  19999/tcp: Web interface
boot: manual
